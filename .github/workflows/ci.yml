name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, 'feat/**']

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Check catalog translations
        run: python3 scripts/check_i18n.py
      - name: Test backend
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress test

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Test frontend
        working-directory: frontend
        run: npm test
      - name: Build frontend and static pages
        working-directory: frontend
        run: npm run build

  research:
    name: Research unit and PostgreSQL integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: research_test
          POSTGRES_PASSWORD: synthetic_test_only
          POSTGRES_DB: research_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U research_test -d research_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      RESEARCH_TEST_DATABASE_URL: postgresql://research_test:synthetic_test_only@127.0.0.1:5432/research_test
      RESEARCH_INTEGRATION_TEST_ACKNOWLEDGE: ephemeral_only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install research API test dependencies
        run: python3 -m pip install -r research/requirements.txt "httpx>=0.27,<1"
      - name: Verify draft research instrument and rotation invariants
        run: python3 -m unittest discover -s research/tests -v
      - name: Phase 2 expert packet and cognitive-rotation checks
        run: python3 -m unittest discover -s research/phase2_tests -v
      - name: Phase 2 static item dashboard and candidate blocking tests
        run: python3 -m unittest discover -s research/phase2_artifact_tests -v
      - name: Generate no-participant static audit dashboard
        run: |
          python3 -m research.item_dashboard --output /tmp/12axes-phase2-audit.html
          python3 -m research.item_audit --output /tmp/12axes-phase2-audit.json
      - name: Publish non-sensitive draft audit as CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase2-public-question-audit
          path: |
            /tmp/12axes-phase2-audit.html
            /tmp/12axes-phase2-audit.json
          retention-days: 14
      - name: Phase 2 readiness and provenance validation (no humans)
        run: python3 -m unittest discover -s research/phase2_workflow_tests -v
      - name: Verify locked 240-question mechanical inventory
        run: python3 -m research.item_audit
      - name: Confirm Phase 2 fielding gate remains closed
        run: |
          python3 - <<'PY'
          from research.phase2_workflow import readiness
          report = readiness()
          assert not report["can_collect_human_political_opinions"]
          assert report["editorial"]["missing"] == 480
          assert not report["gates"]["expert_en_240_complete"]
          assert not report["gates"]["expert_pt_240_complete"]
          print("Research fielding gate closed; missing expert evidence is explicit")
          PY
      - name: Verify item coverage with no interview data
        run: python3 -m research.cognitive_packets --audit
      - name: Synthetic analysis fixture unit tests
        run: python3 -m unittest discover -s research/analysis -p 'test_*.py' -v
      - name: PostgreSQL lifecycle integration tests (synthetic data only)
        run: python3 -m unittest discover -s research/integration_tests -v
      - name: Validate developer Compose configuration
        run: docker compose -f research/docker-compose.yml config --quiet
      - name: Simulate assignment coverage without collecting participant data
        run: python3 -m research.assignment --coverage 14

  research-docker:
    name: Research Docker Compose preview smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start research-only development stack
        run: docker compose -f research/docker-compose.yml up -d --build --wait
      - name: Validate API health, draft preview, and disabled collection
        run: |
          python3 - <<'PY'
          import json
          import time
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          base = "http://127.0.0.1:8090/research-api"
          for attempt in range(40):
              try:
                  with urlopen(base + "/health", timeout=2) as reply:
                      health = json.load(reply)
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise RuntimeError("Research API failed local health check")
          assert health["status"] == "ok"
          assert health["collection_enabled"] is False
          with urlopen(base + "/preview?form_index=0&lang=en", timeout=15) as reply:
              preview = json.load(reply)
          assert preview["instrument_version"] == "draft-0.1"
          assert len(preview["questions"]) == 120
          assert len(preview["archetype_questions"]) == 5
          request = Request(base + "/sessions?lang=en",
              data=json.dumps({"consent": True, "age_18_plus": True,
                               "consent_version": "fake", "invite_code": "fake"}).encode(),
              headers={"Content-Type": "application/json"},
              method="POST")
          try:
              urlopen(request, timeout=5)
          except HTTPError as error:
              assert error.code == 503, f"Expected disabled collection HTTP 503; got {error.code}"
          else:
              raise AssertionError("Research collection must be disabled in Docker preview")
          print("Research Docker smoke: read-only preview OK, collection denied")
          PY
      - name: Remove synthetic development containers and volumes
        if: always()
        run: docker compose -f research/docker-compose.yml down --volumes --remove-orphans
