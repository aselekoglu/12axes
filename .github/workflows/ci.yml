name: CI

on:
  pull_request:
  push:
    branches: [main, 'feat/**']

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Check catalog translations
        run: python3 scripts/check_i18n.py
      - name: Test backend
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress test

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Test frontend
        working-directory: frontend
        run: npm test
      - name: Build frontend and static pages
        working-directory: frontend
        run: npm run build

  research:
    name: Research instrument and offline assignment tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install research API test dependencies
        run: python3 -m pip install -r research/requirements.txt "httpx>=0.27,<1"
      - name: Verify draft research instrument and rotation invariants
        run: python3 -m unittest discover -s research/tests -v
      - name: Simulate assignment coverage without collecting participant data
        run: python3 -m research.assignment --coverage 14
